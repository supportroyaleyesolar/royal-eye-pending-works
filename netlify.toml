# ============================================================================
# Royal Eye Solar Power – Netlify Deployment Configuration (Pillar 3)
# ============================================================================

[build]
  command = "npm run build"
  publish = "dist"

# SPA Fallback: Redirect all routes to /index.html with status 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Cache Optimization Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Immutable caching for Vite hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
